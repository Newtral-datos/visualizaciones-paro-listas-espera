<!doctype html>
<meta charset="utf-8">
<!-- Gráfico: Diferencias entre parados registrados y parados EPA: pegar entero en un bloque HTML del CMS o incrustar en un iframe -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

<div class="nt-diferencias">
  <div class="nt-titulo" role="heading" aria-level="2"><span>Diferencias</span></div>
  <div class="nt-tronco" aria-hidden="true"></div>
  <svg class="nt-llave" viewBox="0 0 600 40" preserveAspectRatio="none" aria-hidden="true"><path d="M1 40 Q1 24 17 24 H583 Q599 24 599 40 M300 0 V24" vector-effect="non-scaling-stroke"/></svg>

  <div class="nt-items">
    <div class="nt-item">
      <div class="nt-cabeza">
        <span class="nt-etiqueta" id="nt-diferencias-etiqueta-1">Parados registrados</span>
        <button type="button" class="nt-circulo" aria-expanded="false" aria-controls="nt-diferencias-texto-1" aria-labelledby="nt-diferencias-etiqueta-1"></button>
      </div>
      <div class="nt-panel" id="nt-diferencias-texto-1"><p>Los parados registrados mensuales del SEPE son <mark class="nt-resalte">personas que se han registrado en las oficinas de empleo</mark>.</p></div>
    </div>
    <div class="nt-item">
      <div class="nt-cabeza">
        <span class="nt-etiqueta" id="nt-diferencias-etiqueta-2">Parados EPA</span>
        <button type="button" class="nt-circulo" aria-expanded="false" aria-controls="nt-diferencias-texto-2" aria-labelledby="nt-diferencias-etiqueta-2"></button>
      </div>
      <div class="nt-panel" id="nt-diferencias-texto-2"><p>Los parados EPA deben haber estado <mark class="nt-resalte">sin trabajo durante la semana de referencia</mark>, disponibles para trabajar y buscando activamente empleo.</p></div>
    </div>
  </div>
</div>

<style>
  .nt-diferencias {
    --nt-verde: #01F3B3;
    --nt-verde-claro: #80F9D9;
    --nt-linea: #333;
    container-type: inline-size;
    max-width: 640px;
    margin: 0 auto;
    padding: 2em 16px;
    background: #fff;
    color: #000;
    font-family: "Roboto", sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    text-align: center;
  }
  .nt-diferencias *, .nt-diferencias *::before, .nt-diferencias *::after { box-sizing: border-box; }
  .nt-diferencias p { margin: 0; font: inherit; color: inherit; }

  /* Cabecera */
  .nt-diferencias .nt-titulo { margin: 0; font-size: 1.5em; font-weight: 700; line-height: 1.3; }
  .nt-diferencias .nt-titulo span { display: inline-block; padding: .1em .35em; background: #000; color: #fff; }
  .nt-diferencias .nt-subtitulo { margin-top: .3em; color: #999; font-size: 1.35em; font-weight: 700; line-height: 1.3; }
  .nt-diferencias .nt-instruccion {
    display: flex; align-items: center; justify-content: center; gap: .6em;
    margin-top: .6em; font-size: 1.15em; font-weight: 700;
  }
  .nt-diferencias .nt-mini { width: 28px; height: 28px; border: 2px dashed var(--nt-verde); border-radius: 50%; }

  /* Línea vertical y llave */
  .nt-diferencias .nt-tronco { width: 1px; height: 110px; margin: 1em auto 0; background: var(--nt-linea); }
  .nt-diferencias .nt-llave { display: block; width: 50.00%; height: 40px; margin: 0 auto; overflow: visible; }
  .nt-diferencias .nt-llave path, .nt-diferencias .nt-flecha path { fill: none; stroke: var(--nt-linea); stroke-width: 1.2px; }

  /* Escritorio: fila de círculos y, debajo, una franja para el texto desplegado.
     Todos los textos ocupan la misma celda, así la franja mide lo que el más largo
     y abrir uno no mueve ni tapa nada. */
  .nt-diferencias .nt-items { display: grid; grid-template-columns: repeat(2, 1fr); row-gap: 1.5em; margin-top: 1.2em; }
  .nt-diferencias .nt-item { display: contents; }
  .nt-diferencias .nt-cabeza { grid-row: 1; display: flex; flex-direction: column; align-items: center; padding: 0 .5em; }
  .nt-diferencias .nt-item:nth-child(1) .nt-cabeza { grid-column: 1; }
  .nt-diferencias .nt-item:nth-child(2) .nt-cabeza { grid-column: 2; }
  .nt-diferencias .nt-item:nth-child(3) .nt-cabeza { grid-column: 3; }
  .nt-diferencias .nt-etiqueta {
    flex: 1; display: flex; align-items: center; justify-content: center;
    max-width: none; margin-bottom: .8em; font-weight: 700; line-height: 1.5;
  }
  .nt-diferencias .nt-flecha { display: block; flex: none; margin: 0 0 1em; }

  .nt-diferencias .nt-circulo {
    all: unset;
    box-sizing: border-box;
    display: block;
    flex: none;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: var(--nt-verde);
    cursor: pointer;
    transition: background-color .2s;
  }
  .nt-diferencias .nt-circulo--vacio { background: transparent; border: 3px dashed var(--nt-verde); }
  .nt-diferencias .nt-circulo:hover,
  .nt-diferencias .nt-circulo[aria-expanded="true"] { background: var(--nt-verde-claro); }
  .nt-diferencias .nt-circulo:focus-visible { outline: 3px solid #000; outline-offset: 4px; }

  .nt-diferencias .nt-panel {
    grid-row: 2;
    grid-column: 1 / -1;
    align-self: start;
    width: min(100%, 21em);
    text-align: left;
    font-weight: 500;
    line-height: 1.6;
    visibility: hidden;
    opacity: 0;
    transition: opacity .2s, visibility 0s linear .2s;
  }
  .nt-diferencias .nt-item:first-child .nt-panel { justify-self: start; }
  .nt-diferencias .nt-item:last-child .nt-panel { justify-self: end; }
  .nt-diferencias .nt-item:not(:first-child):not(:last-child) .nt-panel { justify-self: center; }
  .nt-diferencias .nt-panel.nt-abierto { visibility: visible; opacity: 1; transition: opacity .2s; }
  .nt-diferencias .nt-panel--caja { padding: .7em 1em; background: var(--nt-verde); border-radius: 4px; font-weight: 700; }
  .nt-diferencias .nt-panel--caja p + p { margin-top: .6em; }
  .nt-diferencias .nt-resalte {
    padding: 0 .15em;
    background: var(--nt-verde);
    color: #000;
    font-weight: 700;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  .nt-diferencias .nt-tronco { height: 150px; margin-top: 0; }
  .nt-diferencias .nt-etiqueta { margin-bottom: 2em; font-size: 1.2em; font-weight: 500; }

  /* Móvil: círculos en vertical y cada texto debajo de su círculo, a ancho completo */
  @container (max-width: 599px) {
    .nt-diferencias .nt-tronco { height: 30px; }
    .nt-diferencias .nt-llave { display: none; }
    .nt-diferencias .nt-items { grid-template-columns: 1fr; row-gap: 1.6em; margin-top: 1.5em; }
    .nt-diferencias .nt-circulo { width: 90px; height: 90px; }
    .nt-diferencias .nt-etiqueta { margin-bottom: .5em; }
    .nt-diferencias .nt-flecha { margin-bottom: .5em; }
    .nt-diferencias .nt-item { display: block; }
    .nt-diferencias .nt-item .nt-cabeza { grid-column: auto; }
    .nt-diferencias .nt-etiqueta { max-width: none; }
    .nt-diferencias .nt-item .nt-panel { display: none; width: 100%; margin-top: 1em; }
    .nt-diferencias .nt-item .nt-panel.nt-abierto { display: block; animation: nt-diferencias-fundido .2s; }
  }
  @keyframes nt-diferencias-fundido { from { opacity: 0; } to { opacity: 1; } }
</style>

<script>
(function () {
  // Abrir y cerrar: un círculo abierto a la vez; volver a pinchar el mismo lo cierra
  document.querySelectorAll(".nt-diferencias:not([data-nt-listo])").forEach(function (raiz) {
    raiz.setAttribute("data-nt-listo", "");
    var botones = raiz.querySelectorAll(".nt-circulo");

    function panel(boton) { return raiz.querySelector("#" + boton.getAttribute("aria-controls")); }
    function cerrar(boton) {
      boton.setAttribute("aria-expanded", "false");
      panel(boton).classList.remove("nt-abierto");
    }

    botones.forEach(function (boton) {
      boton.addEventListener("click", function () {
        var abrir = boton.getAttribute("aria-expanded") !== "true";
        botones.forEach(cerrar);
        if (abrir) {
          boton.setAttribute("aria-expanded", "true");
          panel(boton).classList.add("nt-abierto");
        }
      });
    });
    raiz.addEventListener("keydown", function (e) { if (e.key === "Escape") botones.forEach(cerrar); });
  });
})();

// Altura dinámica: dentro de un iframe, avisa a la página que lo contiene de la altura que necesita
(function () {
  if (window.parent === window) return;
  var raiz = document.querySelector(".nt-diferencias");
  var ultima = 0;

  function enviarAltura(forzar) {
    var margen = Math.max(parseFloat(getComputedStyle(raiz).marginBottom), parseFloat(getComputedStyle(document.body).marginBottom));
    var altura = Math.ceil(raiz.getBoundingClientRect().bottom + window.pageYOffset + margen);
    if (altura === ultima && !forzar) return;
    ultima = altura;
    window.parent.postMessage({ tipo: "altura-iframe", altura: altura }, "*");
  }

  if (window.ResizeObserver) new ResizeObserver(function () { enviarAltura(); }).observe(raiz);
  window.addEventListener("load", function () { enviarAltura(); });
  window.addEventListener("resize", function () { enviarAltura(); });
  window.addEventListener("message", function (e) { if (e.data === "pedir-altura") enviarAltura(true); });
  enviarAltura();
})();
</script>
