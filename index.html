<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gráficos de paro y empleo</title>
<style>
  body { margin: 0; padding: 24px 16px 64px; background: #f2f2f2; font-family: Roboto, sans-serif; color: #111; }
  header { max-width: 1000px; margin: 0 auto 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 20px; }
  .anchos button { padding: 6px 12px; border: 1px solid #111; background: #fff; font: inherit; cursor: pointer; }
  .anchos button[aria-pressed="true"] { background: #111; color: #fff; }
  section { max-width: 1000px; margin: 0 auto 32px; }
  h2 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: #666; }
  .marco { margin: 0 auto; background: #fff; transition: width .2s; }
  iframe { display: block; width: 100%; height: 400px; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Gráficos de paro y empleo</h1>
  <div class="anchos" role="group" aria-label="Ancho de vista previa">
    <button type="button" data-ancho="100%" aria-pressed="true">Escritorio</button>
    <button type="button" data-ancho="375px" aria-pressed="false">Móvil (375 px)</button>
  </div>
</header>

<section><h2>1_fuentes_datos.html</h2><div class="marco"><iframe src="1_fuentes_datos.html" title="Las fuentes de los datos" scrolling="no"></iframe></div></section>
<section><h2>2_terminos_mercado_laboral.html</h2><div class="marco"><iframe src="2_terminos_mercado_laboral.html" title="Algunos términos del mercado laboral" scrolling="no"></iframe></div></section>
<section><h2>3_diferencias_parados.html</h2><div class="marco"><iframe src="3_diferencias_parados.html" title="Diferencias entre parados" scrolling="no"></iframe></div></section>
<section><h2>4_terminos_epa.html</h2><div class="marco"><iframe src="4_terminos_epa.html" title="Algunos términos de la EPA" scrolling="no"></iframe></div></section>

<script>
  window.addEventListener("message", function (e) {
    if (!e.data || e.data.tipo !== "altura-iframe") return;
    document.querySelectorAll("iframe").forEach(function (f) {
      if (f.contentWindow === e.source) f.style.height = e.data.altura + "px";
    });
  });
  document.querySelectorAll(".anchos button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".anchos button").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); });
      document.querySelectorAll(".marco").forEach(function (m) { m.style.width = b.dataset.ancho; });
    });
  });
</script>
</body>
</html>
